<body>
    <div class="conatiner mt-5">
        <div class="row">
            <div class="col-md-6">
                    <div class="card">

                <div class="card-header">
                <h4 class="text-danger text-center">Movie Details</h4>
                </div>
                <div class="card-body">
                    <form action=""class="form"id="form">
                        <div>
                            <label for="name">Movie name</label>
                        <input type="text"class="form-control" id="nameInput"placeholder="Enter Name">

                        </div>
                        <div>
                            <label for="name">Movie Review</label>
                        <input type="text"class="form-control" id="review"placeholder="Enter Review">

                        </div>
                        <div>
                            <label for="name"> Rating</label>
                        <input type="text"class="form-control" id="rating"placeholder="0">

                        </div>
                        
                        <button class="btn-block btn btn-primary" id="submit">submit</button>
                        <button type="button"class="btn-block btn btn-primary d-none" id="update">update</button>
                       
                        
                    </form>
                </div>
                </div>
            </div>
            <div class="col-md-6">
            <div class="card">
                <div class="card-body table table-success">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>SrNo</th>
                                <th>Movie name</th>
                                <th>Review</th>
                                <th>Rating</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                        </thead>
                        <tbody id="MovieData">

                        </tr> -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
        </div>
